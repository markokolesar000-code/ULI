* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--on-surface); }
body { font-family:"GSF", system-ui, -apple-system, "Segoe UI", sans-serif; font-size:17px; line-height:25px; -webkit-text-size-adjust:100%; overscroll-behavior:none; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; text-align:inherit; touch-action:manipulation; }
button:disabled { cursor:default; }
summary { list-style:none; cursor:pointer; touch-action:manipulation; }
summary::-webkit-details-marker { display:none; }
svg { display:block; }
.mono, code, .term { font-family:"JBM", ui-monospace, Menlo, monospace; font-variant-ligatures:none; font-feature-settings:"calt" 0, "liga" 0; }
code { font-size:.92em; font-weight:500; background:var(--code-bg); border-radius:6px; padding:0 4px; }

#app { height:100dvh; max-width:560px; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; padding-top:var(--sat); position:relative; }
.screen { flex:1; display:flex; flex-direction:column; min-height:0; }
.scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; }
.pad { padding:8px 16px 20px; display:flex; flex-direction:column; gap:12px; }
.col { display:flex; flex-direction:column; }
.row { display:flex; align-items:center; }
.grow { flex:1; min-width:0; }

/* type */
.display { font-weight:800; font-size:36px; line-height:44px; letter-spacing:-.01em; font-variation-settings:"ROND" 100; }
.headline { font-weight:700; font-size:28px; line-height:36px; font-variation-settings:"ROND" 100; }
.title-l { font-weight:700; font-size:22px; line-height:28px; font-variation-settings:"ROND" 100; }
.title-m { font-weight:600; font-size:16px; line-height:24px; }
.title-s { font-weight:600; font-size:14px; line-height:20px; }
.body-l { font-size:17px; line-height:25px; }
.body-m { font-size:15px; line-height:22px; }
.body-s { font-size:12px; line-height:16px; }
.label-l { font-weight:600; font-size:14px; line-height:20px; }
.label-m { font-weight:600; font-size:12px; line-height:16px; }
.dim { color:var(--on-surface-variant); }

/* shapes and badges */
.badge { position:relative; display:inline-grid; place-items:center; flex:none; }
.badge > svg.shape { position:absolute; inset:0; width:100%; height:100%; }
.badge > svg.ic { position:relative; }
.ic { stroke:currentColor; fill:none; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round; }
.ic.solid { fill:currentColor; stroke:none; }
.tag { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; background:var(--secondary-container); color:var(--on-secondary-container); font-weight:600; font-size:14px; line-height:20px; }

/* buttons */
.big { width:100%; height:64px; border-radius:32px; background:var(--primary); color:var(--on-primary); display:flex; align-items:center; justify-content:center; gap:10px; font-weight:700; font-size:20px; font-variation-settings:"ROND" 100; transition:transform .12s; }
.big:active { transform:scale(.97); }
.big:disabled { background:color-mix(in srgb, var(--on-surface) 12%, transparent); color:color-mix(in srgb, var(--on-surface) 38%, transparent); transform:none; }
.quiet { min-height:44px; padding:0 14px; color:var(--primary); font-weight:600; font-size:15px; }
.quiet.err { color:var(--on-wrong-container); }
.iconbtn { width:48px; height:48px; display:grid; place-items:center; flex:none; border-radius:50%; }
.iconbtn:active { background:var(--s-high); }
.sk { display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:0 14px; border-radius:99px; border:1px solid var(--outline-variant); color:var(--on-surface-variant); font-weight:600; font-size:14px; }
.sk[aria-pressed="true"] { background:var(--primary); color:var(--on-primary); border-color:transparent; }

/* top bars */
.topbar { display:flex; align-items:center; gap:10px; padding:4px 20px 0 4px; }
.seg { flex:1; display:flex; height:14px; align-items:center; gap:4px; }
.seg i { display:block; height:8px; border-radius:4px; background:var(--s-highest); flex:1; position:relative; }
.seg i.right { background:var(--right); } .seg i.wrong { background:var(--wrong); }
.seg i.right::after, .seg i.wrong::after { content:""; position:absolute; left:3px; right:3px; top:1.5px; height:2px; border-radius:2px; background:rgba(255,255,255,.28); }
.seg i.fuse-l { border-top-left-radius:0; border-bottom-left-radius:0; margin-left:-4px; }
.seg i.fuse-r { border-top-right-radius:0; border-bottom-right-radius:0; }
.seg i.cur, .seg i.retry { flex:2; height:12px; border-radius:6px; background:linear-gradient(90deg, color-mix(in srgb, var(--c) 25%, transparent), var(--c)); --c:var(--primary); overflow:hidden; }
.seg i.retry { --c:var(--wrong); }
.seg i.cur::after, .seg i.retry::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(100deg, transparent 0 7px, rgba(255,255,255,.22) 7px 11px); background-size:22px 100%; animation:run 1.4s linear infinite; }
@keyframes run { to { background-position:22px 0; } }
.count { font-weight:700; font-size:17px; white-space:nowrap; font-variation-settings:"ROND" 100; }
.bar { flex:1; height:8px; border-radius:4px; background:var(--s-highest); overflow:hidden; }
.bar > b { display:block; height:100%; background:var(--primary); border-radius:4px; transition:width .4s; }

/* quiz layout */
.qscroll { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-bottom:8px; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.qscroll > * { flex-shrink:0; }
.qcard { margin:8px 12px 0; padding:14px 14px 18px 20px; border-radius:32px; background:color-mix(in srgb, var(--amber) 17%, var(--bg)); display:flex; flex-direction:column; flex-grow:1; }
@media (prefers-color-scheme: dark) { .qcard { background:color-mix(in srgb, var(--primary-container) 30%, var(--bg)); } }
.qcard .head { display:flex; align-items:flex-start; gap:8px; justify-content:space-between; margin-bottom:16px; }
.qcard.compact .head { margin-bottom:10px; }
.qtext { font-weight:500; font-size:23px; line-height:31px; letter-spacing:-.005em; padding-right:6px; }
.qcard.compact .qtext { font-size:20px; line-height:27px; }
.qcard.answered { flex-grow:0; padding:16px 14px 16px 20px; }
.qcard.answered .qtext { font-size:19px; line-height:26px; }
.qsk { margin-top:8px; color:var(--on-surface-variant); padding-right:6px; }
.qfoot { margin-top:auto; padding-top:18px; display:flex; align-items:flex-end; justify-content:space-between; }
.hint { display:flex; align-items:center; gap:8px; color:var(--on-surface-variant); font-weight:600; font-size:14px; padding-bottom:4px; }
.spacer { flex-grow:1; flex-shrink:1 !important; min-height:0; }
.opts { display:flex; flex-direction:column; gap:4px; padding:0 16px; }
.opt { display:block; width:100%; border-radius:20px; background:var(--s-low); box-shadow:0 4px 0 var(--outline-variant); margin-bottom:4px; transition:transform .12s, box-shadow .12s, background .25s, border-radius .25s; position:relative; }
.opt:active:not(:disabled) { transform:translateY(4px); box-shadow:0 0 0 var(--outline-variant); }
.opt .in { display:flex; align-items:center; gap:14px; min-height:68px; padding:12px 14px; }
.opt.sel { background:var(--secondary-container); color:var(--on-secondary-container); box-shadow:0 4px 0 color-mix(in srgb, var(--primary) 55%, transparent); outline:2px solid var(--primary); outline-offset:-2px; border-radius:26px; }
.opt.right { background:var(--right-container); color:var(--on-right-container); box-shadow:none; border-radius:30px; margin-bottom:0; }
.opt.wrong { background:var(--wrong-container); color:var(--on-wrong-container); box-shadow:none; border-radius:30px; margin-bottom:0; }
.opt.missed { box-shadow:none; outline:2.5px solid var(--right); outline-offset:-2.5px; margin-bottom:0; }
.opt.done { cursor:default; }
.opt .note { padding:0 18px 14px 64px; font-size:16px; line-height:23px; }
.opt .txt { flex:1; min-width:0; }
.opt .txt.m { font-family:"JBM", ui-monospace, Menlo, monospace; font-size:16px; line-height:22px; font-weight:500; font-variant-ligatures:none; }
.ob { width:36px; height:36px; flex:none; display:grid; place-items:center; position:relative; font-weight:700; font-size:15px; color:var(--on-surface-variant); }
.ob .shape { position:absolute; inset:0; width:100%; height:100%; }
.ob .ring { position:absolute; inset:0; border-radius:50%; border:2px solid var(--outline); }
.ob.sq .ring { border-radius:10px; }
.ob > span, .ob > svg.ic { position:relative; }
.opt.sel .ob { color:var(--on-primary); } .opt.sel .ob .shape path { fill:var(--primary); } .opt.sel .ob .ring { display:none; }
.opt.right .ob { color:var(--on-right); } .opt.right .ob .shape path { fill:var(--right); } .opt.right .ob .ring { display:none; }
.opt.wrong .ob { color:var(--on-wrong); } .opt.wrong .ob .shape path { fill:var(--wrong); } .opt.wrong .ob .ring { display:none; }
.opt.missed .ob { color:var(--right); } .opt.missed .ob .ring { border-color:var(--right); border-width:2.5px; }
.bottom { padding:6px 16px 12px; }
.bottom.sheet { background:var(--s); }
.counter { display:flex; align-items:center; font-weight:600; font-size:14px; color:var(--on-surface-variant); }
.counter .dot { display:inline-block; width:12px; height:12px; border-radius:50%; background:var(--s-highest); margin-right:5px; transition:all .2s; }
.counter .dot.on { width:16px; height:16px; background:var(--primary); border-radius:40%; margin-right:5px; }

.panel { background:var(--s); border-radius:32px 32px 0 0; padding:16px 20px 20px; }
.verdict { display:flex; align-items:center; gap:14px; min-height:56px; }
.verdict.ok { min-height:76px; }
.verdict .vt { font-weight:700; font-size:28px; line-height:34px; font-variation-settings:"ROND" 100; }
.verdict .back { font-weight:600; font-size:14px; color:var(--on-surface-variant); }
.vbadge { position:relative; width:46px; height:46px; display:grid; place-items:center; flex:none; }
.vwrap { position:relative; width:76px; height:76px; display:grid; place-items:center; flex:none; }
.verdict:not(.ok) .vwrap { width:56px; height:56px; }
.vbadge .shape { position:absolute; inset:0; }
.vbadge .ic { position:relative; }
.spark { position:absolute; left:50%; top:50%; }
.streak { display:inline-flex; align-items:center; gap:6px; padding:6px 12px 6px 8px; border-radius:99px; background:var(--amber); color:var(--on-amber); font-weight:600; font-size:14px; flex:none; }
.hook { display:flex; gap:12px; align-items:flex-start; padding:12px 14px 13px 12px; border-radius:20px; background:color-mix(in srgb, var(--amber) 20%, transparent); margin-top:14px; }
@media (prefers-color-scheme: dark) { .hook { background:color-mix(in srgb, var(--primary-container) 32%, transparent); } }
.hook .t { font-weight:600; font-size:17px; line-height:24px; }
.why { margin-top:20px; } .why .l { font-weight:600; font-size:14px; color:var(--on-surface-variant); margin-bottom:4px; }
.why .b { font-size:16px; line-height:25px; }
.stack > * + * { margin-top:16px; }
.whynot { background:color-mix(in srgb, var(--wrong-container) 55%, transparent); border-radius:18px; padding:12px 16px; }
.whynot .l { color:var(--wrong); font-weight:600; font-size:12px; }

/* terminal */
.term { container-type:inline-size; background:var(--terminal); border-radius:18px; padding:10px 0 12px; margin-top:18px; }
.stack .term, .reviewbody .term { margin-top:0; }
.term .th { display:flex; align-items:center; gap:8px; padding:0 14px 6px; font-size:11px; color:var(--terminal-dim); }
.term .th i { width:7px; height:7px; border-radius:50%; background:var(--amber); display:block; }
.term .tb { padding:0 14px; font-size:clamp(10px, calc((100cqw - 28px) / 26.8), 14px); line-height:1.45; white-space:pre-wrap; overflow-wrap:break-word; color:var(--terminal-dim); }
.term .tb .p { color:var(--amber); font-weight:700; } .term .tb .c { color:var(--terminal-text); font-weight:500; }
.peek { margin-top:18px; border-radius:18px; overflow:hidden; background:var(--terminal); }
.peek summary { display:flex; align-items:center; gap:8px; min-height:60px; padding:10px 10px 10px 14px; }
.peek summary .a { flex:1; min-width:0; } .peek .l { color:var(--terminal-text); font-weight:600; font-size:14px; }
.peek .f { font-family:"JBM", ui-monospace, monospace; font-size:13px; color:var(--terminal-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.peek .f b { color:var(--amber); }
.peek .chev { width:36px; height:36px; border-radius:50%; background:rgba(243,236,223,.14); display:grid; place-items:center; color:var(--terminal-text); transition:transform .2s; }
.peek[open] summary { display:none; }
.peek[open] .term { margin-top:0; }
.peek .fold { display:none; }

.disputed { margin-top:14px; border:1px solid var(--outline-variant); border-radius:24px; padding:6px 10px 6px 14px; }
.disputed[open] { background:var(--s-high); border-radius:20px; padding-bottom:14px; }
.disputed summary { display:flex; align-items:center; gap:8px; min-height:36px; color:var(--on-surface-variant); font-weight:600; font-size:14px; }
.disputed[open] summary .chev { transform:rotate(180deg); }
.disputed .body { padding-top:4px; padding-right:6px; font-size:15px; line-height:22px; }
.disputed .body .s { margin-top:6px; color:var(--on-surface-variant); font-weight:600; font-size:12px; }

/* answer rows */
.arow { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:16px; font-size:15px; line-height:22px; }
.arow.r { background:var(--right-container); color:var(--on-right-container); }
.arow.w { background:var(--wrong-container); color:var(--on-wrong-container); }
.arow .m { font-family:"JBM", ui-monospace, monospace; font-weight:500; font-variant-ligatures:none; }

/* grouped lists */
.group { display:flex; flex-direction:column; gap:3px; }
.group > * { background:var(--s-low); border-radius:6px; }
.group > :first-child { border-top-left-radius:24px; border-top-right-radius:24px; }
.group > :last-child { border-bottom-left-radius:24px; border-bottom-right-radius:24px; }
.group > button:active, .group > a:active { transform:scale(.985); }
.mode { display:flex; align-items:center; gap:14px; width:100%; min-height:64px; padding:8px 10px 8px 12px; transition:transform .12s; }
.mode:disabled { opacity:.5; }
.mode .t { font-weight:600; font-size:17px; flex:1; } .mode .d { font-weight:600; font-size:15px; color:var(--on-surface-variant); }
.lastexam { display:flex; align-items:center; width:100%; min-height:48px; padding:6px 10px 6px 70px; color:var(--on-surface-variant); font-weight:600; font-size:15px; }
.topic { display:block; width:100%; padding:12px 18px 11px; min-height:56px; transition:transform .12s; }
.mbar { position:relative; height:10px; border-radius:5px; background:var(--s-highest); margin:8px 0 6px; overflow:hidden; }
.mbar b { position:absolute; top:0; bottom:0; border-radius:5px; }
.legend { display:flex; flex-wrap:wrap; gap:4px 14px; }
.legend span { display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:12px; color:var(--on-surface-variant); }
.legend i { width:8px; height:8px; border-radius:50%; display:block; }
.legend i.hollow { box-shadow:inset 0 0 0 1px var(--outline); }

/* home */
.header { display:flex; align-items:center; gap:12px; padding:4px 0 4px 4px; position:relative; }
.mark { width:44px; height:44px; border-radius:14px; background:var(--amber); color:var(--on-amber); display:grid; place-items:center; font-family:"JBM", monospace; font-weight:700; font-size:17px; }
.cur-blink { animation:blink 1.06s steps(1) infinite; }
@keyframes blink { 50% { opacity:0; } }
.menu { position:absolute; right:0; top:52px; z-index:5; background:var(--s-high); border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.25); padding:6px; }
.menu button { padding:12px 16px; border-radius:12px; font-weight:600; color:var(--wrong); }
.card { border-radius:34px; padding:16px 20px 16px 16px; }
.ready { background:var(--s-low); }
.ready .top { display:flex; align-items:center; gap:16px; }
.cookie { position:relative; width:88px; height:88px; flex:none; display:grid; place-items:center; }
.cookie .shape { position:absolute; inset:0; width:100%; height:100%; }
.cookie .n { position:relative; display:flex; align-items:flex-end; gap:1px; font-weight:800; font-size:34px; line-height:34px; font-variation-settings:"ROND" 100; }
.cookie .n small { font-size:16px; font-weight:700; line-height:16px; padding-bottom:4px; }
.meter { position:relative; height:22px; margin-top:6px; }
.meter .track { position:absolute; left:0; right:0; top:4px; height:14px; border-radius:7px; background:var(--s-highest); overflow:hidden; }
.meter .zone { position:absolute; left:80%; right:0; top:0; bottom:0; background:color-mix(in srgb, var(--right) 18%, transparent); }
.meter .fill { position:absolute; left:0; top:0; bottom:0; border-radius:7px; background:var(--primary); transition:width .7s cubic-bezier(.3,1.3,.5,1); min-width:14px; }
.meter .fill.ok { background:var(--right); }
.meter .line { position:absolute; left:calc(80% - 1.5px); top:0; bottom:0; width:3px; border-radius:2px; background:var(--on-surface); }
.meter-l { position:relative; height:16px; }
.meter-l span { position:absolute; right:20%; margin-right:6px; font-weight:600; font-size:12px; color:var(--on-surface-variant); white-space:nowrap; }
.dock { padding:4px 16px 12px; background:var(--bg); }
.cont { width:100%; height:84px; border-radius:36px; background:var(--primary); color:var(--on-primary); display:flex; align-items:center; padding:12px 12px 12px 28px; gap:8px; transition:transform .12s; }
.cont:active { transform:scale(.98); }
.cont .t { font-weight:800; font-size:24px; line-height:28px; font-variation-settings:"ROND" 100; }
.cont .s { font-weight:600; font-size:12px; line-height:16px; opacity:.75; }
.cont .go { width:60px; height:60px; position:relative; display:grid; place-items:center; color:var(--on-primary-container); flex:none; }
.cont .go .shape { position:absolute; inset:0; width:100%; height:100%; } .cont .go .shape path { fill:var(--primary-container); }
.alertcard { border-radius:34px; padding:14px 10px 8px 18px; }
.alertcard.bad { background:var(--wrong-container); color:var(--on-wrong-container); }
.alertcard.exam { background:var(--tertiary-container); color:var(--on-tertiary-container); padding-right:8px; padding-bottom:16px; }
.alertcard .acts { display:flex; justify-content:flex-end; }
.alertcard .resume { display:flex; justify-content:center; align-items:center; height:52px; margin-right:10px; border-radius:26px; background:var(--tertiary); color:var(--on-tertiary); font-weight:700; font-size:17px; width:calc(100% - 10px); margin-top:12px; font-variation-settings:"ROND" 100; }

/* round end / exam end */
.hero { display:flex; justify-content:center; padding-top:8px; position:relative; }
.sun { position:relative; width:172px; height:172px; display:grid; place-items:center; }
.sun .shape { position:absolute; inset:0; width:100%; height:100%; }
.sun .n { position:relative; display:flex; align-items:flex-end; font-weight:900; font-size:68px; line-height:68px; font-variation-settings:"ROND" 100; }
.sun .n small { font-size:26px; font-weight:700; opacity:.7; padding-bottom:10px; }
.center { text-align:center; }
.stats { display:flex; background:var(--s-low); border-radius:26px; padding:16px 0; }
.stats > div { flex:1; text-align:center; padding:0 12px; display:flex; flex-direction:column; gap:2px; }
.stats > div + div { border-left:1px solid var(--outline-variant); }
.stats .v { font-weight:800; font-size:28px; line-height:30px; font-variation-settings:"ROND" 100; }
.confetti { position:absolute; left:50%; top:50%; pointer-events:none; }
.endbar { padding:0 16px 8px; background:var(--bg); position:relative; }
.endbar::before { content:""; position:absolute; left:0; right:0; top:-20px; height:20px; background:linear-gradient(transparent, var(--bg)); pointer-events:none; }
.examcard { border-radius:34px; padding:24px; }
.examcard.pass { background:var(--right-container); color:var(--on-right-container); }
.examcard.fail { background:var(--wrong-container); color:var(--on-wrong-container); }
.pbar { position:relative; height:18px; margin:14px 0; }
.pbar .t { position:absolute; left:0; right:0; top:3px; height:12px; border-radius:6px; background:color-mix(in srgb, currentColor 12%, transparent); overflow:hidden; }
.pbar .f { position:absolute; left:0; top:0; bottom:0; border-radius:6px; min-width:12px; }
.pbar .l { position:absolute; left:calc(80% - 1.5px); top:0; bottom:0; width:3px; border-radius:2px; background:currentColor; }
.est { display:flex; align-items:center; gap:14px; background:var(--s-low); border-radius:26px; padding:12px 16px 12px 14px; }
.est .cookie { width:58px; height:58px; } .est .cookie .n { font-size:14px; line-height:16px; }
.review { background:var(--s-low); padding:16px; }
.review summary { display:flex; align-items:flex-start; gap:10px; }
.review summary .pill { display:inline-flex; align-items:center; gap:2px; padding:3px 6px 3px 10px; border-radius:99px; background:var(--s-high); color:var(--on-surface-variant); font-weight:600; font-size:14px; flex:none; }
.review[open] summary .pill .chev { transform:rotate(180deg); }
.reviewbody { padding-top:12px; display:flex; flex-direction:column; gap:6px; }
.reviewbody .sep { height:6px; }
.sechead { padding:14px 0 2px 8px; }

/* browse */
.bhead { display:flex; align-items:center; gap:4px; padding:4px 16px 4px 4px; }
.sticky { position:sticky; top:0; z-index:2; background:var(--bg); display:flex; align-items:flex-end; justify-content:space-between; padding:18px 8px 8px; }
.sticky .c { font-weight:700; font-size:15px; font-variation-settings:"ROND" 100; color:var(--on-surface-variant); }
.sticky .c.all { color:var(--right); }
.brow { padding:14px; }
.brow[open] { background:var(--s); }
.brow summary { display:flex; align-items:flex-start; gap:12px; }
.brow .id { font-family:"JBM", monospace; font-size:12px; color:var(--outline); padding-top:3px; }
.brow .bbody { padding-top:14px; display:flex; flex-direction:column; gap:14px; }
.brow .bbody .rows { display:flex; flex-direction:column; gap:6px; }
.mm { width:22px; height:22px; flex:none; display:grid; place-items:center; margin-top:2px; position:relative; }
.mm .ringx { width:18px; height:18px; border-radius:50%; border:2px solid var(--outline-variant); }

/* dialogs */
.scrim { position:fixed; inset:0; background:rgba(0,0,0,.45); display:grid; place-items:center; padding:24px; z-index:20; }
.dlg { width:100%; max-width:380px; background:var(--s-high); border-radius:28px; padding:24px 24px 12px; }
.dlg h2 { margin:0 0 12px; font-weight:700; font-size:22px; line-height:28px; font-variation-settings:"ROND" 100; }
.dlg p { margin:0; color:var(--on-surface-variant); font-size:15px; line-height:22px; }
.dlg .acts { display:flex; flex-wrap:wrap; justify-content:flex-end; margin-top:16px; }
.dlg .acts .danger { color:var(--wrong); }

/* motion (only when a page or an answer just appeared) */
@keyframes slidein { from { transform:translateX(40px); opacity:0; } to { transform:none; opacity:1; } }
@keyframes rise { from { transform:translateY(26px); opacity:0; } to { transform:none; opacity:1; } }
@keyframes pop { 0% { transform:scale(.4) rotate(-60deg); } 60% { transform:scale(1.15) rotate(8deg); } 100% { transform:none; } }
@keyframes shake { 20% { transform:translateX(-10px); } 40% { transform:translateX(9px); } 60% { transform:translateX(-6px); } 80% { transform:translateX(4px); } }
@keyframes sheet { from { transform:translateY(40px); opacity:0; } to { transform:none; opacity:1; } }
@keyframes fly { from { transform:translate(-50%,-50%) translate(var(--x0),var(--y0)) scale(.4); opacity:1; } to { transform:translate(-50%,-50%) translate(var(--x1),var(--y1)) rotate(180deg) scale(.8); opacity:0; } }
@keyframes spin-in { from { transform:rotate(-120deg) scale(.4); } to { transform:none; } }
.anim-page .qscroll > .qcard, .anim-page .qscroll > .opts { animation:slidein .35s cubic-bezier(.2,.8,.2,1); }
.anim-page .opts .opt { animation:rise .4s cubic-bezier(.2,.9,.3,1.2) backwards; }
.anim-page .opts .opt:nth-child(1) { animation-delay:.07s; } .anim-page .opts .opt:nth-child(2) { animation-delay:.125s; }
.anim-page .opts .opt:nth-child(3) { animation-delay:.18s; } .anim-page .opts .opt:nth-child(4) { animation-delay:.235s; }
.anim-page .opts .opt:nth-child(5) { animation-delay:.29s; } .anim-page .opts .opt:nth-child(6) { animation-delay:.345s; }
.anim-phase .panel { animation:sheet .35s cubic-bezier(.2,.8,.2,1); }
.anim-phase .opt.wrong { animation:shake .3s; }
.anim-phase .opt.right { animation:pop .35s; }
.anim-phase .vwrap .vbadge { animation:pop .5s cubic-bezier(.3,1.4,.5,1); }
.anim-phase .spark { animation:fly .65s ease-out forwards; }
.anim-page .sun { animation:spin-in .9s cubic-bezier(.3,1.4,.5,1); }
.anim-page .confetti { animation:none; }
.anim-page .confetti i { position:absolute; animation:fly 1.15s cubic-bezier(.4,0,.2,1) forwards; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

/* additions */
.ob .shape { display:none; }
.opt.sel .ob .shape, .opt.right .ob .shape, .opt.wrong .ob .shape { display:block; }
.opt .in { display:flex; } .opt .note { display:block; }
.pm { position:relative; width:68px; height:68px; display:grid; place-items:center; flex:none; }
.pm svg { position:absolute; inset:0; width:100%; height:100%; animation:spin 24s linear infinite; }
.pm span { position:relative; font-family:"JBM", monospace; font-weight:700; font-size:22px; color:var(--on-amber); }
@keyframes spin { to { transform:rotate(360deg); } }
.tr { display:flex; align-items:center; }
.sparkshape { width:100%; height:100%; display:block; }
.sp { position:absolute; left:50%; top:50%; }
.grid2 { display:flex; gap:20px; }
.exstat .v { font-weight:700; font-size:18px; line-height:22px; font-variation-settings:"ROND" 100; }
.exstat .l { font-weight:600; font-size:12px; opacity:.7; }

.cont .go svg.ic { position:relative; }
.qscroll.answered { padding-bottom:0; }
.qscroll.answered .panel { flex-grow:1; }

</style>
</head>

(()=>{var Je=[{id:1,topic:"intro",kind:"single",choose:1,question:"Embedded Systems means:",questionSk:"Vstavan\xE9 syst\xE9my (embedded systems) znamenaj\xFA:",options:[{text:"Companies must share their changes",correct:!1},{text:"You can view the software\u2019s source code",correct:!1,note:"Pr\xEDstup k zdrojov\xE9mu k\xF3du je vlastnos\u0165 open source, nie vstavan\xFDch syst\xE9mov."},{text:"Businesses cannot charge anything for the software, only the hardware",correct:!1},{text:"Systems designed to do a specific task on hardware optimized for only that purpose",correct:!0},{text:"Users must support the systems themselves",correct:!1}],explanation:"Vstavan\xFD syst\xE9m je po\u010D\xEDta\u010D zabudovan\xFD v zariaden\xED (router, pr\xE1\u010Dka, telev\xEDzor), ktor\xFD rob\xED jednu konkr\xE9tnu \xFAlohu na hardv\xE9ri navrhnutom len na \u0148u. Ve\u013Emi \u010Dasto na \u0148om be\u017E\xED Linux.",hook:"Embedded = zabudovan\xFD v krabi\u010Dke, rob\xED jednu vec.",source:"ok"},{id:2,topic:"intro",kind:"single",choose:1,question:"Linux originally only ran on:",questionSk:"Linux p\xF4vodne be\u017Eal iba na:",options:[{text:"Xerox copy machines",correct:!1},{text:"Specialized processor chips",correct:!1},{text:"Intel 386 PCs",correct:!0},{text:"Raspberry Pi computers",correct:!1,note:"Raspberry Pi vzniklo a\u017E v roku 2012, Linux je z roku 1991."},{text:"Macintosh",correct:!1}],explanation:"Linus Torvalds nap\xEDsal Linux v roku 1991 ako hobby projekt pre svoje PC s procesorom Intel 80386. Na \u010Fal\u0161ie architekt\xFAry (ARM, PowerPC a in\xE9) ho preniesli a\u017E nesk\xF4r.",hook:"1991, Linus, Intel 386: odtia\u013E i386 v n\xE1zvoch bal\xEDkov.",source:"ok"},{id:3,topic:"intro",kind:"single",choose:1,question:"Bundling utilities, management tools, and application software with a Linux kernel is called a:",questionSk:"Spojenie util\xEDt, n\xE1strojov na spr\xE1vu a aplika\u010Dn\xE9ho softv\xE9ru s linuxov\xFDm jadrom sa naz\xFDva:",options:[{text:"A trademark",correct:!1},{text:"A distribution of Linux",correct:!0},{text:"A type of hardware",correct:!1},{text:"A text editor",correct:!1}],explanation:"Samotn\xFD Linux je len jadro. Distrib\xFAcia (Ubuntu, Debian, Fedora) ho zabal\xED spolu s n\xE1strojmi, spr\xE1vcom bal\xEDkov a aplik\xE1ciami do pou\u017Eite\u013En\xE9ho syst\xE9mu.",hook:"Jadro + v\u0161etko okolo = distrib\xFAcia (distro).",source:"ok"},{id:4,topic:"intro",kind:"single",choose:1,question:"A software release cycle describes:",questionSk:"Cyklus vyd\xE1vania softv\xE9ru (release cycle) opisuje:",options:[{text:"How often security fixes are implemented",correct:!1,note:"Bezpe\u010Dnostn\xE9 z\xE1platy vych\xE1dzaj\xFA priebe\u017Ene, nie pod\u013Ea cyklu vyd\xE1vania nov\xFDch verzi\xED."},{text:"How often the software\u2019s memory is released back to the operating system",correct:!1},{text:"How often upgrades come out for software",correct:!0},{text:"How often the computer must be rebooted",correct:!1},{text:"How often the computer must be upgraded to support new software",correct:!1}],explanation:"Release cycle hovor\xED, ako \u010Dasto vych\xE1dzaj\xFA nov\xE9 verzie softv\xE9ru. Napr\xEDklad Ubuntu vyd\xE1va nov\xFA verziu ka\u017Ed\xFDch 6 mesiacov a LTS ka\u017Ed\xE9 2 roky. Bezpe\u010Dnostn\xE9 opravy chodia priebe\u017Ene, mimo tohto cyklu.",source:"ok"},{id:5,topic:"intro",kind:"multi",choose:3,question:"Apple\u2019s OS X is:",questionSk:"Apple OS X je:",options:[{text:"A fully certified UNIX distribution",correct:!0},{text:"Tightly integrated with Apple hardware",correct:!0},{text:"Partially based on code from the FreeBSD project",correct:!0},{text:"Primarily used to manage network services",correct:!1,note:"OS X je hlavne desktopov\xFD syst\xE9m, nie syst\xE9m na spr\xE1vu sie\u0165ov\xFDch slu\u017Eieb."},{text:"Derived from Linux",correct:!1,note:"Nie, OS X vych\xE1dza z BSD a jadra Mach. Linux je samostatn\xE1 vetva."},{text:"Able to natively run Windows binaries",correct:!1}],explanation:"macOS (OS X) je certifikovan\xFD UNIX, je \xFAzko previazan\xFD s hardv\xE9rom Apple a jeho jadro Darwin preber\xE1 ve\u013Ea k\xF3du z FreeBSD. S Linuxom nem\xE1 spolo\u010Dn\xFD k\xF3d.",hook:"Mac = BSD v obleku, nie Linux.",source:"ok"},{id:6,topic:"intro",kind:"multi",choose:3,question:"Microsoft Windows:",questionSk:"Microsoft Windows:",options:[{text:"Is generally backwards compatible with previous versions",correct:!0},{text:"Offers both desktop and server products",correct:!0},{text:"Has a Linux compatibility mode",correct:!1,note:"Pod\u013Ea k\u013E\xFA\u010Da NDG nie. WSL s\xEDce existuje, ale sk\xFA\u0161ka t\xFAto mo\u017Enos\u0165 neuzn\xE1va."},{text:"Has a short maintenance cycle",correct:!1,note:"Naopak, Microsoft podporuje svoje verzie ve\u013Ea rokov, cyklus \xFAdr\u017Eby je dlh\xFD."},{text:"Has a scripting environment called PowerShell",correct:!0},{text:"Has a new desktop version every year.",correct:!1,note:"Nov\xE9 verzie Windows vych\xE1dzaj\xFA raz za nieko\u013Eko rokov, nie ka\u017Ed\xFD rok."}],explanation:"Windows si dr\u017E\xED sp\xE4tn\xFA kompatibilitu, m\xE1 desktopov\xE9 aj serverov\xE9 ed\xEDcie a PowerShell ako skriptovacie prostredie. Na sk\xFA\u0161ke plat\xED, \u017Ee \u201ELinux compatibility mode\u201C nie je spr\xE1vna odpove\u010F. V praxi dnes existuje WSL (Windows Subsystem for Linux), ale k\u013E\xFA\u010D NDG s n\xEDm nepo\u010D\xEDta.",source:"disputed: Windows 10/11 v praxi maj\xFA WSL (Linux compatibility), k\u013E\xFA\u010D NDG to za spr\xE1vnu odpove\u010F nepova\u017Euje"},{id:7,topic:"intro",kind:"multi",choose:2,question:"An interpreted programming language:",questionSk:"Interpretovan\xFD programovac\xED jazyk:",options:[{text:"Requires a compilation step but no linking step",correct:!1,note:"Interpretovan\xFD jazyk nepotrebuje kompil\xE1ciu ani linkovanie."},{text:"Is converted into machine specific instructions as the program runs",correct:!0},{text:"Tends to offer more features than compiled languages",correct:!0},{text:"Requires a linking step but no compilation step",correct:!1},{text:"Takes fewer resources to run than a compiled language",correct:!1,note:"Naopak, preklad po\u010Das behu stoj\xED viac CPU aj pam\xE4te ne\u017E skompilovan\xFD program."}],explanation:"Interpreter preklad\xE1 k\xF3d na strojov\xE9 in\u0161trukcie a\u017E po\u010Das behu, preto netreba kompil\xE1ciu ani linkovanie. Na sk\xFA\u0161ke plat\xED aj tvrdenie, \u017Ee interpretovan\xE9 jazyky \u201Epon\xFAkaj\xFA viac funkci\xED\u201C. V praxi to v\u0161eobecne neplat\xED, ale k\u013E\xFA\u010D NDG ho vy\u017Eaduje.",hook:"Interpretovan\xFD = preklad\xE1 za behu, ako simult\xE1nny tlmo\u010Dn\xEDk.",source:"disputed: 'tends to offer more features than compiled languages' je tvrdenie NDG k\u013E\xFA\u010Da, v praxi v\u0161eobecne neplat\xED"},{id:8,topic:"intro",kind:"multi",choose:2,question:"The two main families of Linux shells are:",questionSk:"Dve hlavn\xE9 rodiny linuxov\xFDch shellov s\xFA:",options:[{text:"Bourne Shell",correct:!0},{text:"Python Shell",correct:!1},{text:"Korn shell",correct:!1,note:"Korn shell (ksh) patr\xED do rodiny Bourne shellu, nie je samostatn\xE1 rodina."},{text:"Emacs",correct:!1},{text:"C Shell",correct:!0}],explanation:"Shelly sa delia na rodinu Bourne shellu (sh, bash, ksh, zsh) a rodinu C shellu (csh, tcsh). Bash znamen\xE1 Bourne Again SHell.",hook:"Bash = Bourne Again SHell, druh\xE1 rodina je csh.",source:"ok"},{id:9,topic:"intro",kind:"multi",choose:2,question:"In virtualization, what are the host and guest?",questionSk:"\u010Co je pri virtualiz\xE1cii hostite\u013E (host) a hos\u0165 (guest)?",options:[{text:"The host is the machine that runs the virtual machines",correct:!0},{text:"The guest is the machine that runs the virtual machines",correct:!1},{text:"The terms can be used interchangeably",correct:!1},{text:"A host is a virtual machine",correct:!1},{text:"A guest is a virtual machine",correct:!0}],explanation:"Host je fyzick\xFD stroj s hyperv\xEDzorom, ktor\xFD sp\xFA\u0161\u0165a virtu\xE1lne stroje. Guest je virtu\xE1lny stroj, ktor\xFD na \u0148om be\u017E\xED.",hook:"Host host\xED, guest je na n\xE1v\u0161teve.",source:"ok"},{id:10,topic:"intro",kind:"single",choose:1,question:"Cloud computing is:",questionSk:"Cloud computing:",options:[{text:"Requires fewer resources because systems are shared among many users",correct:!1},{text:"Allows users in different geographical regions to work together in real time",correct:!1},{text:"All are correct",correct:!0},{text:"Is made possible by faster internet speeds",correct:!1},{text:"Is useful for both business and home users",correct:!1}],explanation:"V\u0161etky tvrdenia sedia: zdie\u013Eanie zdrojov \u0161etr\xED hardv\xE9r, \u013Eudia z r\xF4znych miest spolupracuj\xFA v re\xE1lnom \u010Dase, umo\u017Enil to r\xFDchlej\u0161\xED internet a hod\xED sa firm\xE1m aj dom\xE1cnostiam.",source:"ok"},{id:11,topic:"intro",kind:"multi",choose:3,question:"Which of the following are properties of a strong password?",questionSk:"Ktor\xE9 z nasleduj\xFAcich s\xFA vlastnosti siln\xE9ho hesla?",options:[{text:"Based on easy to remember items like birthdays",correct:!1,note:"D\xE1tum narodenia sa d\xE1 \u013Eahko uh\xE1dnu\u0165 alebo doh\u013Eada\u0165."},{text:"Long so that it can be reused on multiple sites",correct:!1,note:"D\u013A\u017Eka je dobr\xE1, ale opakovan\xE9 pou\u017Eitie je chyba: jeden \xFAnik prezrad\xED v\u0161etky \xFA\u010Dty."},{text:"Includes symbols",correct:!0},{text:"At least 10 characters long",correct:!0},{text:"A mix of upper and lower case",correct:!0}],explanation:"Siln\xE9 heslo je dlh\xE9 (aspo\u0148 10 znakov) a mie\u0161a mal\xE9 a ve\u013Ek\xE9 p\xEDsmen\xE1 a symboly, tak\u017Ee sa \u0165a\u017Eko h\xE1da aj l\xE1me hrubou silou. To ist\xE9 heslo nikdy nepou\u017E\xEDvaj na viacer\xFDch str\xE1nkach.",source:"ok"},{id:12,topic:"opensource",kind:"single",choose:1,question:"A license where you don\u2019t have access to the source code is called:",questionSk:"Licencia, pri ktorej nem\xE1\u0161 pr\xEDstup k zdrojov\xE9mu k\xF3du, sa naz\xFDva:",options:[{text:"Sourceless",correct:!1},{text:"Impaired source",correct:!1},{text:"Open source",correct:!1},{text:"Closed source",correct:!0}],explanation:"Closed source (propriet\xE1rny) softv\xE9r dostane\u0161 len ako hotov\xFD bin\xE1rny program, zdrojov\xFD k\xF3d zost\xE1va zatvoren\xFD u autora. Opakom je open source.",source:"ok"},{id:13,topic:"opensource",kind:"single",choose:1,question:"A copyleft provision in a software license means:",questionSk:"Ustanovenie copyleft v softv\xE9rovej licencii znamen\xE1:",options:[{text:"You must provide support for your modifications",correct:!1},{text:"You may not link against third party closed source software",correct:!1,note:"GPL rie\u0161i \u0161\xEDrenie zdrojov\xE9ho k\xF3du, linkovanie s uzavret\xFDm softv\xE9rom priamo nezakazuje."},{text:"If you redistribute the software, you must distribute the source to any changes you make",correct:!0},{text:"You must provide free copies of the software if you use it",correct:!1},{text:"You give up your copyright to the software",correct:!1,note:"Nie, autor si copyright ponech\xE1va. Copyleft ho pr\xE1ve vyu\u017E\xEDva na vyn\xFAtenie podmienok."}],explanation:"Copyleft (napr\xEDklad GPL) hovor\xED: ke\u010F upraven\xFD softv\xE9r \u010Falej \u0161\xEDri\u0161, mus\xED\u0161 spr\xEDstupni\u0165 aj zdrojov\xFD k\xF3d svojich zmien pod rovnakou licenciou. K\xFDm ho len pou\u017E\xEDva\u0161 s\xE1m, ni\u010D zverej\u0148ova\u0165 nemus\xED\u0161.",hook:"Copyleft: \u010Do dostane\u0161 otvoren\xE9, \u010Falej d\xE1\u0161 otvoren\xE9.",source:"ok"},{id:14,topic:"opensource",kind:"multi",choose:2,question:"The Free Software Foundation believes that:",questionSk:"Free Software Foundation zast\xE1va n\xE1zor, \u017Ee:",options:[{text:"Software should be free to modify",correct:!0},{text:"People should write software with no expectation of making money",correct:!1,note:"FSF nem\xE1 ni\u010D proti zar\xE1baniu na softv\xE9ri, ide jej o slobodu."},{text:"Software should not have copyright",correct:!1,note:"Licencia GPL je postaven\xE1 pr\xE1ve na copyrighte."},{text:"Software should be free to share",correct:!0},{text:"No money should ever change hands",correct:!1,note:"Predaj slobodn\xE9ho softv\xE9ru je pod\u013Ea FSF v poriadku."}],explanation:"FSF ch\xE1pe \u201Efree\u201C ako slobodu, nie ako cenu: softv\xE9r m\xE1 by\u0165 slobodne upravite\u013En\xFD a \u0161\xEDrite\u013En\xFD. Pred\xE1va\u0165 slobodn\xFD softv\xE9r je \xFAplne v poriadku.",hook:"Free as in freedom, not free beer.",source:"ok"},{id:15,topic:"opensource",kind:"single",choose:1,question:"What does it mean when a work is placed in the public domain?",questionSk:"\u010Co znamen\xE1, ke\u010F je dielo uvo\u013Enen\xE9 ako public domain (vo\u013En\xE9 dielo)?",options:[{text:"The work was done by a government agency",correct:!1},{text:"You may not use the work for commercial purposes",correct:!1},{text:"The author has died",correct:!1,note:"Autorsk\xE9 pr\xE1va trvaj\xFA e\u0161te desa\u0165ro\u010Dia po smrti autora, dielo sa nest\xE1va vo\u013En\xFDm hne\u010F."},{text:"The author has relinquished the copyright on the work",correct:!0},{text:"You must redistribute changes to the software",correct:!1,note:"Povinnos\u0165 zverejni\u0165 zmeny je copyleft, nie public domain."}],explanation:"Autor sa vzdal autorsk\xFDch pr\xE1v, dielo u\u017E nikomu nepatr\xED a ktoko\u013Evek ho m\xF4\u017Ee pou\u017Ei\u0165 na \u010Doko\u013Evek, aj komer\u010Dne.",source:"ok"},{id:16,topic:"cli",kind:"truefalse",choose:1,question:"The semicolon (;) can be used to separate multiple commands to be executed in order.",questionSk:"Bodko\u010Diarkou (;) m\xF4\u017Ee\u0161 oddeli\u0165 viac pr\xEDkazov, ktor\xE9 sa vykonaj\xFA postupne.",options:[{text:"True",correct:!0},{text:"False",correct:!1}],explanation:"Pri ; sa pr\xEDkazy spustia jeden po druhom bez oh\u013Eadu na to, \u010Di predch\xE1dzaj\xFAci uspel. Na podmienen\xE9 re\u0165azenie sl\xFA\u017Ei && (\u010Fal\u0161\xED len pri \xFAspechu) a || (\u010Fal\u0161\xED len pri zlyhan\xED).",demo:`$ echo jeden; cat nic; echo dva
jeden
cat: nic: No such file or directory
dva`,source:"ok"},{id:17,topic:"cli",kind:"single",choose:1,question:"To be able to output messages to the screen, use the _______ command:",questionSk:"Na v\xFDpis spr\xE1v na obrazovku pou\u017Ei pr\xEDkaz _______:",options:[{text:"print",correct:!1,note:"Pr\xEDkaz print v bashi nie je, pozn\xE1\u0161 ho z Pythonu."},{text:"echo",correct:!0},{text:"display",correct:!1},{text:"type",correct:!1,note:"type zist\xED, \u010D\xEDm je pr\xEDkaz (alias, builtin, s\xFAbor), spr\xE1vy nevypisuje."}],explanation:"echo vyp\xED\u0161e svoje argumenty na \u0161tandardn\xFD v\xFDstup. V skriptoch sa n\xEDm vypisuj\xFA spr\xE1vy aj hodnoty premenn\xFDch.",demo:`$ echo Ahoj $USER
Ahoj bob`,source:"ok"},{id:18,topic:"cli",kind:"single",choose:1,question:"The _______ command will print a list of the commands that you\u2019ve previously executed.",questionSk:"Pr\xEDkaz _______ vyp\xED\u0161e zoznam pr\xEDkazov, ktor\xE9 si predt\xFDm spustil.",options:[{text:"list",correct:!1},{text:"eval",correct:!1},{text:"exec",correct:!1},{text:"history",correct:!0}],explanation:"Bash si pam\xE4t\xE1 zadan\xE9 pr\xEDkazy a uklad\xE1 ich do ~/.bash_history. Pr\xEDkaz history ich vyp\xED\u0161e o\u010D\xEDslovan\xE9 a napr\xEDklad !102 spust\xED pr\xEDkaz \u010D\xEDslo 102 znova.",demo:`$ history | tail -3
  101  cd /etc

  103  history | tail -3`,source:"ok"},{id:19,topic:"cli",kind:"single",choose:1,question:"HOME is an example of _________.",questionSk:"HOME je pr\xEDkladom _________.",options:[{text:"A path variable",correct:!1,note:"Tak\xFD druh premennej neexistuje. PATH je len \u010Fal\u0161ia premenn\xE1 prostredia."},{text:"A local variable",correct:!1,note:"Lok\xE1lnu premenn\xFA spusten\xE9 programy nevidia. HOME vidia, lebo je exportovan\xE1."},{text:"An environment variable",correct:!0},{text:"An alias",correct:!1},{text:"An internal command",correct:!1}],explanation:"HOME je premenn\xE1 prostredia: shell ju exportuje, tak\u017Ee ju zdedia v\u0161etky programy, ktor\xE9 spust\xED\u0161. Lok\xE1lna premenn\xE1 by existovala len v aktu\xE1lnom shelli.",hook:"VE\u013DK\xC9 p\xEDsmen\xE1 = zvy\u010Dajne premenn\xE1 prostredia (HOME, PATH, USER).",demo:`$ echo $HOME

anna  bob  Tom  Walt

anna bob`,source:"ok"},{id:31,topic:"archives",kind:"single",choose:1,question:"In general, for which of the following would you want to use lossless compression?",questionSk:"Pri ktorom z nasleduj\xFAcich by si vo v\u0161eobecnosti chcel pou\u017Ei\u0165 bezstratov\xFA kompresiu?",options:[{text:"A JPEG image",correct:!1},{text:"A log file",correct:!0},{text:"An encrypted email",correct:!1,note:"\u0160ifrovan\xE9 d\xE1ta vyzeraj\xFA ako n\xE1hodn\xFD \u0161um, tak\u017Ee sa skoro v\xF4bec nedaj\xFA skomprimova\u0165."},{text:"A movie",correct:!1},{text:"An mp3 audio file",correct:!1}],explanation:"Pri texte, ako je log s\xFAbor, mus\xED po rozbalen\xED sedie\u0165 ka\u017Ed\xFD bajt, preto bezstratov\xE1 kompresia (gzip, bzip2, xz). JPEG, MP3 a filmy s\xFA u\u017E stratovo skomprimovan\xE9 a \u0161ifrovan\xE9 d\xE1ta sa takmer nedaj\xFA zmen\u0161i\u0165.",hook:"Text a logy: ka\u017Ed\xFD bajt sa r\xE1ta, teda bezstratovo.",source:"ok"},{id:32,topic:"archives",kind:"multi",choose:2,question:"You type gzip myfile.tar. What happens?",questionSk:"Nap\xED\u0161e\u0161 gzip myfile.tar. \u010Co sa stane?",options:[{text:"An error; you forgot to specify the file with -f",correct:!1},{text:"myfile.tar is unarchived into the current directory",correct:!1,note:"gzip arch\xEDvy nerozba\u013Euje, len komprimuje jeden s\xFAbor. Rozba\u013Euje gunzip alebo tar."},{text:"myfile.tar is removed",correct:!0},{text:"An error; you forgot to pass the name of the output file",correct:!1},{text:"myfile.tar.gz holds a compressed version of myfile.tar",correct:!0}],explanation:"gzip komprimuje s\xFAbor na mieste: vytvor\xED myfile.tar.gz a p\xF4vodn\xFD myfile.tar zma\u017Ee. Ak chce\u0161 origin\xE1l ponecha\u0165, pou\u017Ei gzip -k.",hook:"gzip zje origin\xE1l a nech\xE1 po sebe .gz.",demo:`$ ls

start
end
$ grep -vE 'start|end' file.txt
middle`,source:"ok"},{id:38,topic:"scripts",kind:"single",choose:1,question:"A file begins with #!/bin/csh. This means:",questionSk:"S\xFAbor za\u010D\xEDna riadkom #!/bin/csh. Znamen\xE1 to:",options:[{text:"This is a Perl script",correct:!1},{text:"The operator should not be using /bin/csh",correct:!1},{text:"C Shell compatibility mode is enabled",correct:!1,note:"\u017Diadny re\u017Eim kompatibility sa nezap\xEDna, skript jednoducho spust\xED skuto\u010Dn\xFD /bin/csh."},{text:"Running the script will invoke /bin/csh to interpret the rest of the file",correct:!0},{text:"Nothing, this is a comment",correct:!1,note:"Pre shell je to s\xEDce koment\xE1r, ale jadro #! na prvom riadku \u010D\xEDta a pod\u013Ea neho vyberie interpret."}],explanation:"Prv\xFD riadok so znakmi #! (shebang) hovor\xED jadru, ktor\xFDm interpretom m\xE1 skript spusti\u0165. Tu sa zvy\u0161ok s\xFAboru vykon\xE1 pomocou C shellu /bin/csh.",hook:"Shebang #! = \u201Espusti ma t\xFDmto programom\u201C.",source:"ok"},{id:39,topic:"scripts",kind:"single",choose:1,question:"Most of nano\u2019s commands take the form of:",questionSk:"V\xE4\u010D\u0161ina pr\xEDkazov editora nano m\xE1 tvar:",options:[{text:"Alt and another character",correct:!1,note:"Nieko\u013Eko skratiek s Alt existuje (napr. M-U = sp\xE4\u0165), ale v\xE4\u010D\u0161ina je cez Ctrl."},{text:"Escape followed by another character",correct:!1},{text:"The F1 through F12 function keys",correct:!1},{text:"Mouse clicks",correct:!1},{text:"Control and another character",correct:!0}],explanation:"nano sa ovl\xE1da kl\xE1vesom Ctrl a \u010Fal\u0161\xEDm znakom, napr\xEDklad Ctrl+O ulo\u017E\xED a Ctrl+X ukon\u010D\xED. V spodnej li\u0161te ich vid\xED\u0161 zap\xEDsan\xE9 ako ^O a ^X.",hook:"^ v spodnej li\u0161te nano = Ctrl.",source:"ok"},{id:40,topic:"scripts",kind:"single",choose:1,question:"The if command looks for what exit code to consider a condition to be true?",questionSk:"Ak\xFD n\xE1vratov\xFD k\xF3d pova\u017Euje pr\xEDkaz if 0
$ false; echo $?
1`,source:"ok"},{id:41,topic:"scripts",kind:"single",choose:1,question:"The number of users logged in is in a variable called USERS. How would you test to see if 5 users are logged in?",questionSk:"Po\u010Det prihl\xE1sen\xFDch pou\u017E\xEDvate\u013Eov je v premennej USERS. Ako otestuje\u0161, \u010Di je prihl\xE1sen\xFDch pr\xE1ve 5 pou\u017E\xEDvate\u013Eov?",options:[{text:"test $USERS -eq 5",correct:!0},{text:"test $USERS,5",correct:!1},{text:"test -f USERS=5",correct:!1,note:"-f testuje, \u010Di existuje be\u017En\xFD s\xFAbor, s porovnan\xEDm \u010D\xEDsel nem\xE1 ni\u010D spolo\u010Dn\xE9."},{text:"test $USERS = 5",correct:!1,note:"= porovn\xE1va re\u0165azce. Pre hodnotu 5 to v praxi prejde, ale sk\xFA\u0161ka chce \u010D\xEDseln\xE9 -eq."},{text:"test $USERS -a 5",correct:!1,note:"-a je logick\xE9 AND medzi dvoma podmienkami, nie porovnanie."}],explanation:"-eq porovn\xE1va cel\xE9 \u010D\xEDsla, tak\u017Ee test $USERS -eq 5 je pravda, ke\u010F USERS m\xE1 hodnotu 5. Oper\xE1tor = porovn\xE1va re\u0165azce. Na sk\xFA\u0161ke je spr\xE1vne len -eq. V praxi by pri hodnote presne 5 pre\u0161lo aj =, ale napr\xEDklad 05 by ako re\u0165azec u\u017E nesedelo.",hook:"\u010C\xEDsla: -eq -ne -lt -gt. Re\u0165azce: = a !=.",demo:`$ USERS=5

0
